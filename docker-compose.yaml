services:
  linear-regression-mle-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "mle_linear_regression_service"
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs
    environment:
      - PROJECT_NAME="Linear Regression MLE"
    restart: "always"